[project]
name = "echo-planner"
version = "0.1.0"
description = "A 25-turn planning agent on the OpenAI Agents SDK, exporting OpenInference telemetry over OTLP/HTTP."
requires-python = ">=3.10,<3.15"
dependencies = [
    "openai-agents==0.23.1",
    "openai==3.29.0",
    "openinference-instrumentation-openai-agents==2.5.3",
    "openinference-instrumentation-openai==0.1.65",
    "opentelemetry-sdk==1.45.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
]

[tool.uv]
package = false
